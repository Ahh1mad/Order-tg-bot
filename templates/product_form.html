{% extends "base.html" %}{% block content %}
<h1>{{ 'Редактировать товар' if product else 'Новый товар' }}</h1>
<form method="post">
  <label>Название</label>
  <input name="name" required value="{{ product.name if product else '' }}">
  <label>Описание</label>
  <textarea name="description" rows="4">{{ product.description if product else '' }}</textarea>
  <label>Цена</label>
  <input name="price" type="number" step="0.01" min="0" required value="{{ product.price if product else '' }}">
  <label><input name="is_active" type="checkbox" {{ 'checked' if (product and product.is_active) or not product }} style="width:auto"> Активен (виден в каталоге)</label>
  <p><button>Сохранить</button> <a href="{{ url_for('products') }}">Отмена</a></p>
</form>
{% endblock %}
