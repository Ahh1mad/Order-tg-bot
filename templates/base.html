<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Админ-панель</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    nav { background: #2b3a4a; padding: 12px 20px; display: flex; gap: 16px; }
    nav a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 1000px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e3e8ee; text-align: left; }
    a.btn, button { background: #3b82f6; color: #fff; border: 0; padding: 6px 12px;
                    border-radius: 6px; text-decoration: none; cursor: pointer; }
    button.danger, a.danger { background: #ef4444; }
    input, select, textarea { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('orders') }}">Заказы</a>
    <a href="{{ url_for('products') }}">Товары</a>
    <a href="{{ url_for('logout') }}">Выйти</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
