<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Вход</title>
<style>body{font-family:system-ui;max-width:360px;margin:60px auto}input{width:100%;padding:8px;margin:8px 0;box-sizing:border-box}button{width:100%;padding:8px;background:#3b82f6;color:#fff;border:0;border-radius:6px}.error{color:#ef4444}</style>
</head><body>
<h2>Админ-панель</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <input name="username" placeholder="Логин" required>
  <input name="password" type="password" placeholder="Пароль" required>
  <button>Войти</button>
</form>
</body></html>
